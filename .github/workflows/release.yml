name: Release Windows Portable

# Only run manually; pushing a tag does not trigger a release.
on: workflow_dispatch

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

# Avoid running two releases for the same tag simultaneously.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Windows x64 and draft release
    runs-on: windows-latest

    env:
      RELEASE_TAG: ${{ github.ref_name }}

    steps:
      # 1. Require a release tag selected in "Use workflow from".
      - name: Validate release tag
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -ne 'tag') {
            throw 'Select a tag in "Use workflow from" when running this workflow.'
          }

          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Invalid release tag: $env:RELEASE_TAG"
          }

      # 2. Build the exact commit selected for this workflow run.
      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # 3. Set up Python for Windows x64.
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          architecture: x64

      # 4. Check that the package version matches the selected tag.
      - name: Verify package version
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          if ($env:RELEASE_TAG -ne "v$version") {
            throw "Tag $env:RELEASE_TAG does not match package version $version"
          }

      # 5. Install the frozen dependencies.
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          .\.venv\Scripts\python.exe -m pip install -r requirements-build.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          .\.venv\Scripts\python.exe -m pip install --no-deps --no-build-isolation .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          .\.venv\Scripts\python.exe -m pip check

      # 6. Run tests. Do not execute tests/live.
      - name: Run tests
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe -m pytest tests/unit tests/integration

      # 7. Reuse the existing PyInstaller build script.
      - name: Build portable package
        shell: cmd
        run: call build_portable.bat

      # 8. Test the extracted ZIP against a local mock API; no LLM service is used.
      - name: Test portable package
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe -m pytest tests/portable

      # 9. Generate signed build provenance.
      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: dist/st-character-card-translate-windows-x64.zip

      # 10. Create a draft with the ZIP; publish it manually from the Releases page.
      - name: Create draft GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:RELEASE_TAG" `
            "dist/st-character-card-translate-windows-x64.zip" `
            --draft `
            --verify-tag `
            --generate-notes
